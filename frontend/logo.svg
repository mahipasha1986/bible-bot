<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">کلام حیات</title>
  <desc id="desc">لوگوی شفاف کلام حیات برای صفحه اصلی</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1d999"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a6b18"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071527"/>
      <stop offset="100%" stop-color="#1f4e79"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8e2ea"/>
      <stop offset="100%" stop-color="#66788a"/>
    </linearGradient>
  </defs>

  <!-- Cross -->
  <g transform="translate(400 62)">
    <rect x="-14" y="0" width="28" height="125" rx="3" fill="url(#gold)"/>
    <rect x="-64" y="48" width="128" height="28" rx="3" fill="url(#gold)"/>
    <path d="M-14 125 L0 139 L14 125 Z" fill="#c99624"/>
  </g>

  <!-- Main swoosh -->
  <path d="M143 166 C83 265 115 392 242 445 C363 496 553 463 654 337" fill="none" stroke="url(#navy)" stroke-width="34" stroke-linecap="round"/>
  <path d="M151 163 C105 254 128 354 218 410" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round" opacity=".95"/>
  <path d="M248 374 C340 425 482 417 555 360" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" opacity=".95"/>
  <path d="M297 405 C393 439 506 423 602 363" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".95"/>

  <!-- Word mark approximation -->
  <text x="400" y="300"
        direction="rtl"
        text-anchor="middle"
        font-family="Lalezar, Vazirmatn, Tahoma, Arial, sans-serif"
        font-size="118"
        font-weight="700"
        fill="#071f3d"
        letter-spacing="-5">کلام حیات</text>

  <!-- Olive branch -->
  <g transform="translate(574 242) rotate(24)">
    <path d="M0 170 C42 113 63 51 81 0" fill="none" stroke="url(#navy)" stroke-width="10" stroke-linecap="round"/>
    <g fill="url(#silver)">
      <ellipse cx="33" cy="127" rx="14" ry="31" transform="rotate(-35 33 127)"/>
      <ellipse cx="61" cy="102" rx="14" ry="31" transform="rotate(42 61 102)"/>
      <ellipse cx="45" cy="80" rx="13" ry="29" transform="rotate(-34 45 80)"/>
      <ellipse cx="75" cy="55" rx="13" ry="29" transform="rotate(43 75 55)"/>
      <ellipse cx="61" cy="32" rx="12" ry="27" transform="rotate(-30 61 32)"/>
      <ellipse cx="90" cy="12" rx="12" ry="27" transform="rotate(43 90 12)"/>
      <ellipse cx="16" cy="158" rx="11" ry="26" transform="rotate(-35 16 158)"/>
    </g>
    <g stroke="#ffffff" stroke-width="2" opacity=".55" stroke-linecap="round">
      <path d="M33 145 L33 111"/><path d="M61 120 L61 84"/><path d="M45 96 L45 64"/>
      <path d="M75 72 L75 39"/><path d="M61 48 L61 18"/><path d="M90 29 L90 -2"/>
    </g>
  </g>
</svg>
